<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SmartTransit Bakı">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3a3a"/>
      <stop offset="1" stop-color="#14191c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b705"/>
      <stop offset="1" stop-color="#ffd43b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- S-shaped route: Smart + Transit -->
  <path d="M19 47 H33 C41 47 45 43 45 38.5 C45 34 41 31 33 31 H31 C23 31 19 28 19 23.5 C19 19 23 16 31 16 H44"
        fill="none" stroke="url(#line)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- start stop -->
  <circle cx="19" cy="47" r="5.5" fill="#14191c" stroke="#ffffff" stroke-width="3"/>
  <!-- live bus position -->
  <circle cx="45" cy="16" r="7.5" fill="#2fb5a8" opacity=".35"/>
  <circle cx="45" cy="16" r="4.5" fill="#2fb5a8" stroke="#ffffff" stroke-width="2"/>
</svg>
